<svg xmlns="http://www.w3.org/2000/svg" width="230" height="800">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
    <linearGradient id="leatherGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3f2622"/>
      <stop offset="30%" stop-color="#5a3834"/>
      <stop offset="65%" stop-color="#4e302c"/>
      <stop offset="100%" stop-color="#3a2220"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.01)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.08)"/>
    </linearGradient>
  </defs>
  <rect width="230" height="800" fill="url(#leatherGrad)"/>
  <rect width="230" height="800" fill="url(#leatherGrad)" filter="url(#grain)" opacity="0.4"/>
  <rect width="230" height="800" fill="url(#sheen)"/>
  <line x1="218" y1="10" x2="218" y2="790" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-dasharray="6,5"/>
  <line x1="214" y1="10" x2="214" y2="790" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
  <rect x="220" y="0" width="10" height="800" fill="rgba(0,0,0,0.2)"/>
</svg>
